<section class="wt-leave wt-card"><h2>Request leave / permission to be absent</h2><p>Requests go to HR for review. Leave is approved only after a reviewer confirms it.</p><div class="wt-message" role="status" aria-live="polite"></div><form class="wt-leave-form"><label>Leave type<select name="leave_type" aria-label="Leave type"><option>Annual</option><option>Permission</option><option>Sick</option><option>Emergency</option><option>Unpaid</option><option>Study</option><option>Compassionate</option><option>Maternity</option><option>Paternity</option></select></label><label>Start date<input type="date" name="start_date" required></label><label>Number of calendar days<input name="days" type="number" min="1" max="366" step="1" value="1" required></label><label>Reason<textarea name="reason" maxlength="1000" required></textarea></label><button type="submit">Send request to HR</button></form><h3 style="margin-top:22px">My requests</h3><div class="wt-my-leaves">Loading requests...</div></section>
