<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2e0848">
    <meta name="description" content="Sign in to the SmartLiving Emporium Plus secure workspace.">
    <title>Sign in | SmartLiving Emporium Plus</title>
    <link rel="icon" href="{{ url_for('static', filename='login/smartliving-logo.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='login/smartliving-logo.png') }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="SmartLiving Emporium Plus">
    <meta property="og:description" content="Secure workspace for SmartLiving Emporium Plus.">
    <meta property="og:url" content="{{ url_for('login.login', _external=True, _scheme='https') }}">
    <meta property="og:image" content="{{ url_for('static', filename='login/smartliving-logo.png', _external=True, _scheme='https') }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="768">
    <meta property="og:image:height" content="768">
    <meta property="og:image:alt" content="SmartLiving Emporium Plus logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SmartLiving Emporium Plus">
    <meta name="twitter:image" content="{{ url_for('static', filename='login/smartliving-logo.png', _external=True, _scheme='https') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login/assets/index-CShV2Ba5.css') }}">
  </head>
  <body>
    {% with flashed = get_flashed_messages(with_categories=true) %}
      <script>
        window.__SMARTLIVING_LOGIN__ = {
          action: {{ url_for('login.login') | tojson }},
          forgotPasswordUrl: {{ url_for('auth_password_reset.forgot_password') | tojson }},
          next: {{ (next_url or '') | tojson }},
          messages: [
            {% for category, message in flashed %}{{ message | tojson }}{% if not loop.last %},{% endif %}{% endfor %}
          ]
        };
      </script>
    {% endwith %}
    <div id="root"></div>
    <noscript>
      <form method="post" action="{{ url_for('login.login') }}">
        {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
    </noscript>
    <script type="module" src="{{ url_for('static', filename='login/assets/index-f5G8VVWW.js') }}"></script>
  </body>
</html>
