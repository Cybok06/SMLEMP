<section class="staff-loans" data-management="{{ 'true' if loan_management else 'false' }}" data-employee-id="{{ loan_employee_id|default('') }}">
  <div class="sl-heading"><div><h2>Staff Loans</h2><p>Loans, advances and shared expenses. Only the employee share is repayable.</p></div><button type="button" class="sl-refresh">Refresh</button></div>
  <div class="sl-message" role="status" aria-live="polite"></div><div class="sl-summary"></div>
  {% if loan_management %}
  <details class="sl-create"><summary>Record staff debt</summary><form class="sl-loan-form">
    <label>Staff member<select aria-label="Staff member" name="employee_id" required><option value="">Loading staff...</option></select></label>
    <fieldset class="sl-manual" hidden><legend>Manual staff details</legend><label>Full name<input name="staff_name" maxlength="150"></label><label>Phone<input name="staff_phone" maxlength="60"></label><label>Staff reference / employee number<input name="staff_code" maxlength="100"></label><label>Branch<input name="staff_branch" maxlength="150"></label></fieldset>
    <label>Type<select aria-label="Type" name="kind"><option>Loan</option><option>Advance</option><option>Shared expense</option></select></label>
    <label>Total cost (GHS)<input type="number" name="total" min="0.01" step="0.01" required></label><label>Company contribution (GHS)<input type="number" name="company" min="0" step="0.01" value="0" required></label><div class="sl-share">Employee share: GHS 0.00</div>
    <label>Reason<textarea name="reason" maxlength="1000" required></textarea></label><label>Issue date<input type="date" name="issued_date" required></label><label>Payment due<input type="date" name="due_date" required></label><button type="submit">Record debt</button>
  </form></details>
  {% if not loan_employee_id %}<label class="sl-filter-label">Filter by staff<select aria-label="Filter by staff" class="sl-filter"><option value="">All staff</option></select></label>{% endif %}
  {% endif %}
  <div class="sl-records">Loading loan records...</div>
</section>
<link rel="stylesheet" href="{{ url_for('static', filename='css/staff_loans.css') }}">
<script src="{{ url_for('static', filename='js/staff_loans.js') }}" defer></script>
